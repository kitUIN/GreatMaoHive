name: Verify and publish Native AOT
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  linux-installer:
    name: Verify Linux one-command installer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer syntax and failure recovery tests
        run: |
          bash -n scripts/install-linux.sh scripts/install-linux-smoke.sh
          python3 scripts/test_install_linux.py
      - name: Install public release without credentials and verify repeat installation
        run: sudo env -u GH_TOKEN -u GITHUB_TOKEN bash scripts/install-linux-smoke.sh
  verify:
    name: Test and publish (${{ matrix.rid }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            suffix: .exe
          - os: ubuntu-24.04
            rid: linux-x64
            suffix: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = '0.2.0'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tags must be vMAJOR.MINOR.PATCH (stable releases only).'
            }
            $version = $env:REF_NAME.Substring(1)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Tests
        run: dotnet test tests/GreatMaoNet.Tests/GreatMaoNet.Tests.csproj -r ${{ matrix.rid }} -p:SelfContained=true --logger trx
      - name: Native AOT publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime '${{ matrix.rid }}' -Version '${{ steps.version.outputs.version }}'
      - name: Verify embedded version
        shell: pwsh
        run: |
          foreach ($application in @('GreatMaoNetHive', 'GreatMaoNetBee')) {
            $version = & "./artifacts/publish/$application/${{ matrix.rid }}/$application${{ matrix.suffix }}" --version
            if ($LASTEXITCODE -ne 0 -or $version -ne '${{ steps.version.outputs.version }}') { throw 'Binary version mismatch' }
          }
      - name: Native process smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1 -HivePath 'artifacts/publish/GreatMaoNetHive/${{ matrix.rid }}/GreatMaoNetHive${{ matrix.suffix }}' -BeePath 'artifacts/publish/GreatMaoNetBee/${{ matrix.rid }}/GreatMaoNetBee${{ matrix.suffix }}'
      - name: Native updater replacement and restart test
        shell: pwsh
        run: ./scripts/update-smoke.ps1 -Runtime '${{ matrix.rid }}'
      - name: Native console command smoke test
        shell: pwsh
        run: ./scripts/console-smoke.ps1 -HivePath 'artifacts/publish/GreatMaoNetHive/${{ matrix.rid }}/GreatMaoNetHive${{ matrix.suffix }}' -BeePath 'artifacts/publish/GreatMaoNetBee/${{ matrix.rid }}/GreatMaoNetBee${{ matrix.suffix }}'
      - name: Package native applications
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-packages-${{ matrix.rid }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.rid }}
          retention-days: 14
          path: |
            artifacts/verification/**/*.json
            artifacts/verification/**/*.log
            tests/**/TestResults/
  release:
    name: Publish GitHub Release
    needs: [verify, linux-installer]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-packages-*
          path: packages
          merge-multiple: true
      - name: Publish complete verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Get-ChildItem packages -File
          if ($packages.Count -ne 8) { throw 'Expected four packages and four checksums.' }
          foreach ($application in @('GreatMaoNetHive', 'GreatMaoNetBee')) {
            foreach ($rid in @('win-x64', 'linux-x64')) {
              $name = "$application-$rid.zip"
              $expected = ((Get-Content -Raw "packages/$name.sha256").Trim() -split '\s+')[0]
              if ((Get-FileHash "packages/$name" -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch: $name" }
            }
          }
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Release is already published; use a new version tag.' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes --title $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release.' }
          }
          gh release upload $env:RELEASE_TAG $packages.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
